name: Dependency security repair (temporary)
on:
  push:
    branches: [fix/ci-build-and-examples]
    paths: ['.github/workflows/dependency-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'WeDoCareGlobal/AgentVault-Next' && github.ref == 'refs/heads/fix/ci-build-and-examples'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Update vulnerable direct dependencies and regenerate lockfile
        run: |
          pnpm -r update vitest zod --latest
          pnpm update vitest --latest
          pnpm install --frozen-lockfile
      - name: Validate dependency security
        run: pnpm audit --audit-level=high
      - name: Validate workspace
        run: |
          pnpm typecheck
          pnpm -r --workspace-concurrency=1 --sort build
          pnpm -r --no-bail test
      - name: Commit validated dependency updates to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml packages/*/package.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): upgrade vulnerable workspace dependencies"
            git push origin HEAD:fix/ci-build-and-examples
          fi
